<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html"><img src="images/logo.png" alt="" class="nav-logo">J.L. Cranston</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="short-fiction.html">Short Fiction</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="wrap">
  <header class="page">
    <h1>Contact</h1>
  </header>
  <form class="contact-form" action="https://formspree.io/f/myezyken" method="POST">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="_replyto" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">Send message</button>
    <p class="form-note">Messages go straight to my inbox &mdash; I read everything, and I'll get back to you when I can.</p>
  </form>
</div>

<footer>
  <div class="wrap">
    <p>&copy; J.L. Cranston</p>
  </div>
</footer>

</body>
</html>
